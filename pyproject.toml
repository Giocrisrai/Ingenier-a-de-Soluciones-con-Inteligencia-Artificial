# Proyecto de dependencias para notebooks y prácticas del curso (no es un paquete instalable).
# Uso recomendado: uv sync  →  (opcional) source .venv/bin/activate  →  uv run jupyter lab

[project]
name = "ingenieria-soluciones-con-ia"
version = "0.1.0"
description = "Materiales del curso Ingeniería de Soluciones con Inteligencia Artificial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Groq: proveedor de LLMs del curso ---
    "groq>=0.11.0",
    # Cliente genérico del protocolo tipo OpenAI. NO es para hablar con OpenAI:
    # lo usa deploy/backend/agent.py apuntando a la URL de Groq, para que el
    # artefacto desplegable no quede atado a un proveedor concreto.
    "openai>=1.0.0",
    "langchain-groq>=0.2.0",
    # --- Embeddings locales (Groq no ofrece endpoint de embeddings) ---
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "langchain>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langsmith>=0.3.0",
    "langgraph>=0.3.0",
    # CrewAI habla con Groq a través de LiteLLM (prefijo "groq/"): desde crewai 1.x
    # LiteLLM ya no viene incluido y Groq no es un proveedor nativo, así que el extra
    # [litellm] es obligatorio o `LLM(model="groq/...")` falla con ImportError.
    "crewai[litellm]>=0.100.0",
    "crewai-tools>=0.38.0",
    "faiss-cpu>=1.7.0",
    "tiktoken>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
    "wikipedia>=1.4.0",
    "langchain-classic>=0.3.0",
    "lxml>=6.0.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.42.0",
    "slowapi>=0.1.9",
]

[tool.uv]
package = false
