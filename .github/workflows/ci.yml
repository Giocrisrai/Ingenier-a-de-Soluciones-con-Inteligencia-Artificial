name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sincronizar dependencias (lock)
        run: uv sync --frozen

      - name: Verificar imports del curso
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: uv run python scripts/verify_env.py

      # Notebooks con esquema válido, sin referencias a GitHub Models, requirements.txt
      # alineado con pyproject.toml y todos los .py compilan. No llama a ningún LLM.
      - name: Validar repositorio
        run: uv run python scripts/validate_repo.py

      - name: Tests
        run: uv run pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ingenieria-soluciones-ia:ci
